<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <script>
        (function () {
            let theme = null;
            try { theme = localStorage.getItem('reader3:theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f4f4f9; --card-bg: #fff; --heading: #333; --title: #2c3e50; --meta: #666;
            --rule: #ddd; --cover-bg: #f0f0f0; --btn: #3498db; --btn-hover: #2980b9;
            --shadow: rgba(0,0,0,0.1); --shadow-strong: rgba(0,0,0,0.15); --text: #212529;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-bg: #151618; --card-bg: #212327; --heading: #e8eaed; --title: #e8eaed; --meta: #a0a4ab;
            --rule: #34373e; --cover-bg: #2a2c31; --btn: #2f6fa8; --btn-hover: #3b82c4;
            --shadow: rgba(0,0,0,0.4); --shadow-strong: rgba(0,0,0,0.5); --text: #d7d9dc;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--page-bg); color: var(--text); margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rule); padding-bottom: 10px; }
        h1 { color: var(--heading); margin: 0; }
        .theme-toggle-btn { background: var(--card-bg); color: var(--meta); border: 1px solid var(--rule); border-radius: 8px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
        .theme-toggle-btn .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle-btn .icon-sun { display: inline; }
        :root[data-theme="dark"] .theme-toggle-btn .icon-moon { display: none; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .book-card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px var(--shadow); transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow-strong); }
        .book-cover { width: 100%; height: 250px; object-fit: contain; border-radius: 4px; margin-bottom: 15px; background: var(--cover-bg); }
        .book-cover-placeholder { width: 100%; height: 250px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 4px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 3em; font-weight: bold; }
        .book-title { font-size: 1.2em; font-weight: bold; color: var(--title); margin-bottom: 10px; }
        .book-meta { color: var(--meta); font-size: 0.9em; margin-bottom: 15px; }
        .btn { display: inline-block; background: var(--btn); color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 0.9em; }
        .btn:hover { background: var(--btn-hover); }
        .btn-container { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Library</h1>
            <button class="theme-toggle-btn" id="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
                <span class="icon-moon">☾</span><span class="icon-sun">☀</span>
            </button>
        </div>

        {% if not books %}
            <p>No processed books found. Run <code>reader3.py</code> on an epub first.</p>
        {% endif %}

        <div class="book-grid">
            {% for book in books %}
            <div class="book-card">
                {% if book.has_cover %}
                <img src="/cover/{{ book.id | urlencode }}" alt="{{ book.title }} cover" class="book-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="book-cover-placeholder" style="display:none;">📖</div>
                {% else %}
                <div class="book-cover-placeholder">📖</div>
                {% endif %}
                <div class="book-title">{{ book.title }}</div>
                <div class="book-meta">
                    {{ book.author }}<br>
                    {{ book.chapters }} sections
                </div>
                <div class="btn-container">
                    <a href="/read/{{ book.id | urlencode }}/0" class="btn read-btn"
                       data-book-id="{{ book.id }}" data-chapters="{{ book.chapters }}">Read Book</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('reader3:theme', next); } catch (e) {}
        });

        // Resume where the reader left off (position is saved by the reader page)
        document.querySelectorAll('a.read-btn').forEach((btn) => {
            try {
                const pos = JSON.parse(localStorage.getItem('reader3:pos:' + btn.dataset.bookId));
                const total = parseInt(btn.dataset.chapters, 10);
                if (pos && Number.isInteger(pos.chapter) && pos.chapter >= 0 && pos.chapter < total
                    && (pos.chapter > 0 || pos.frac > 0.01)) {
                    btn.href = '/read/' + encodeURIComponent(btn.dataset.bookId) + '/' + pos.chapter;
                    btn.textContent = 'Continue (section ' + (pos.chapter + 1) + ')';
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
